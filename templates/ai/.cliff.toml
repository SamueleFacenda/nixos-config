# git-cliff configuration for Keep a Changelog format
# https://github.com/orhun/git-cliff

[changelog]
header = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n\nThe format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),\nand this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}
## {{ group | upper_first }}
{% for commit in commits %}
{% if commit.scope %}- **{{ commit.scope }}:** {{ commit.message }}{% else %}- {{ commit.message }}{% endif %}
{% endfor %}
{% endfor %}
"""
footer = """

---
*Generated by [git-cliff](https://github.com/orhun/git-cliff)*
"""

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^(?m)^(?P<type>feat|fix|perf|refactor|docs|style|test|chore|build|ci|revert)(?:\\((?P<scope>[^)]+)\\))?: (?P<message>.*)$" },
  { message = "^(?m)^(?P<type>feat|fix|perf|refactor|docs|style|test|chore|build|ci|revert): (?P<message>.*)$" },
  { message = "^(?m)^(?P<type>BREAKING CHANGE): (?P<message>.*)$", group = "Breaking Changes" }
]
commit_preprocessors = [
  { pattern = "^(?m)^(.*?)\\n\\n(.*)$", replace = "{{ commit }}" }
]
protect_breaking_commits = true
filter_commits = false
include_merge_commits = false
strip_prefixes = []

[git.conventional_commits]
types = [
  { type = "feat", section = "Features" },
  { type = "fix", section = "Bug Fixes" },
  { type = "perf", section = "Performance Improvements" },
  { type = "refactor", section = "Refactoring" },
  { type = "docs", section = "Documentation" },
  { type = "style", section = "Styling" },
  { type = "test", section = "Tests" },
  { type = "chore", section = "Chores" },
  { type = "build", section = "Build System" },
  { type = "ci", section = "Continuous Integration" },
  { type = "revert", section = "Reverts" }
]

[output]
path = "CHANGELOG.md"
target = "{{ tag_name }}"

[template]
comparison = "https://github.com/{{ repository }}/compare/{{ previous_tag }}..{{ tag }}"