# GitLab CI/CD for AI-assisted development project
# All jobs use Nix for reproducibility.

stages:
  - validate
  - test
  - security
  - build

variables:
  NIX_CONFIG: "experimental-features = nix-command flakes"

default:
  image: nixos/nix:latest
  before_script:
    - nix --version

flake-check:
  stage: validate
  script:
    - nix flake check --show-trace

test:
  stage: test
  script:
    - nix develop -c just test

security-scan:
  stage: security
  script:
    - nix develop -c just security

# Produces the image tarball as an artifact; requires the `docker`
# option enabled in flake.nix. Push jobs need a runner with docker.
docker-image:
  stage: build
  script:
    - nix build .#dockerImage
    - cp -L result ai-project.tar
  artifacts:
    paths:
      - ai-project.tar
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
