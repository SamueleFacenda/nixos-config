[package]
name = "ai-project"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
description = "AI-assisted development project"
repository = "https://github.com/user/ai-project"
authors = ["User <user@example.com>"]
categories = ["ai", "development-tools"]
keywords = ["ai", "llm", "development", "agent"]
readme = "README.md"
homepage = "https://github.com/user/ai-project"
documentation = "https://docs.rs/ai-project"

[workspace]
resolver = "2"
members = ["src/rust/*"]

[dependencies]
# Core
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# AI/OpenRouter
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
async-openai = "0.20"

# Config
config = "0.14"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tokio-test = "0.4"
mockito = "1"
tempfile = "3"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true

[[bin]]
name = "ai-project"
path = "src/rust/main.rs"