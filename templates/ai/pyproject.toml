[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{{project_name}}"
version = "0.1.0"
description = "{{project_description}}"
readme = "README.md"
license = {text = "EUPL-1.2"}
authors = [{name = "{{author_name}}", email = "{{author_email}}"}]
maintainers = [{name = "{{author_name}}", email = "{{author_email}}"}]
keywords = ["ai", "llm", "development", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "async-openai>=0.20",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "typer>=0.12",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pre-commit>=3.8",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "hypothesis>=6.100",
]

[project.urls]
Homepage = "https://github.com/{{github_user}}/{{project_name}}"
Repository = "https://github.com/{{github_user}}/{{project_name}}"
Documentation = "https://github.com/{{github_user}}/{{project_name}}/blob/main/docs"
Issues = "https://github.com/{{github_user}}/{{project_name}}/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/python"]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-style = "space"
indent-width = 4
quote-style = "double"
docstring-code-format = true
extend-select = ["I", "UP", "PTH", "TRY", "SIM", "TID", "ARG", "FLY", "PD", "RUF", "TCH", "QF"]
ignore = ["E501", "B008"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PTH", "TRY", "SIM", "TID", "ARG", "FLY", "PD", "RUF", "TCH", "QF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["{{project_name}}"]
known-third-party = ["pydantic", "httpx", "openai", "rich", "typer", "loguru"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
indent-width = 4
line-length = 100
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests"]
severity_level = "medium"
confidence_level = "medium"

[tool.pre-commit-ci]
autofix_commit_msg = "chore: auto-fix from pre-commit.com"
autofix_prs = true
autoupdate_branch = ""
autoupdate_commit_msg = "chore: pre-commit autoupdate"
autoupdate_schedule = "weekly"
skip = []
submodules = false