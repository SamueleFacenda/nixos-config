name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NIX_CONFIG: "experimental-features = nix-command flakes"

jobs:
  checks:
    name: Nix flake checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Run flake checks (includes pre-commit)
        run: nix flake check --show-trace

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [checks]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Run tests
        run: nix develop -c just test

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [checks]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Run security scans
        run: nix develop -c just security

  # Manual trigger: requires the `docker` option enabled in flake.nix
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [checks]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Build image
        run: nix build .#dockerImage

      - name: Load image
        run: docker load < result

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          docker tag ai-project:latest $IMAGE:latest
          docker tag ai-project:latest $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
