# Pre-commit configuration for AI-assisted development project
# See https://pre-commit.com for more information

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: fix-byte-order-marker

  # Git commit message validation
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.0.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
        additional_dependencies: [cz-conventional-changelog]

  # Conventional commits
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']

  # Shell scripts
  - repo: https://github.com/shellchecklc/shellcheck
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: ['-x']

  # Nix
  - repo: https://github.com/DeterminateSystems/pre-commit-hooks-nix
    rev: v1.0.0
    hooks:
      - id: nix-fmt
      - id: statix

  # Rust
  - repo: https://github.com/rust-lang/rustfmt
    rev: v1.7.0
    hooks:
      - id: rustfmt
        files: \.rs$

  - repo: https://github.com/rust-lang/clippy
    rev: v1.7.0
    hooks:
      - id: clippy
        files: \.rs$

  # Python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-PyYAML]

  # Security
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: [-r, ., -f, json, -o, bandit-report.json]

  - repo: https://github.com/pypa/pip-audit
    rev: v2.6.0
    hooks:
      - id: pip-audit

  # Node.js
  - repo: https://github.com/prettier/prettier
    rev: 3.3.0
    hooks:
      - id: prettier
        files: \.(js|ts|jsx|tsx|json|yaml|yml|md|css|scss|html)$

  - repo: https://github.com/eslint/eslint
    rev: v9.0.0
    hooks:
      - id: eslint
        files: \.(js|ts|jsx|tsx)$
        additional_dependencies:
          - eslint@latest
          - '@typescript-eslint/eslint-plugin@latest'
          - '@typescript-eslint/parser@latest'

  # Markdown
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: ['--fix']

  # Docker
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint
        files: Dockerfile.*

  # Secrets detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks